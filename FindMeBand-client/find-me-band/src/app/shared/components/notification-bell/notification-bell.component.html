<div class="nb-wrap">
  <button
    class="nb-btn"
    [class.nb-btn--active]="s.isOpen()"
    [attr.aria-expanded]="s.isOpen()"
    [attr.aria-label]="
      s.unreadCount() > 0
        ? 'Notifikacije, ' + s.unreadCount() + ' nepročitanih'
        : 'Notifikacije'
    "
    (click)="onBellClick($event)"
  >
    <app-icon name="bell" [size]="22" />
    @if (s.unreadCount() > 0) {
      <span class="nb-badge" aria-hidden="true">
        {{ s.unreadCount() > 9 ? '9+' : s.unreadCount() }}
      </span>
    }
  </button>

  @if (s.isOpen()) {
    <div class="nb-panel" role="dialog" aria-label="Notifikacije" (click)="onPanelClick($event)">
      <div class="nb-panel-header">
        <span class="nb-panel-title">Notifikacije</span>
        @if (s.unreadCount() > 0) {
          <button class="nb-read-all-btn" (click)="s.markAllRead()">
            Označi sve kao pročitano
          </button>
        }
      </div>

      <div class="nb-list">
        @if (s.notifications().length === 0) {
          <app-empty-state icon="bell" message="Nema notifikacija" />
        }

        @for (n of s.notifications(); track n.id) {
          <button
            class="nb-item"
            [class.nb-item--unread]="!n.isRead"
            (click)="onNotificationClick(n.id, n.isRead)"
          >
            <span class="nb-item-icon" [class]="'nb-item-icon--' + notifKind(n.type)">
              <app-icon [name]="notifIcon(n.type)" [size]="14" />
            </span>
            <span class="nb-item-body">
              <span class="nb-item-msg">{{ n.message }}</span>
              <time class="nb-item-time" [attr.datetime]="n.createdAt">
                {{ s.formatDate(n.createdAt) }}
              </time>
            </span>
            @if (!n.isRead) {
              <span class="nb-item-dot" aria-label="Nepročitano"></span>
            }
          </button>
        }
      </div>
    </div>
  }
</div>
