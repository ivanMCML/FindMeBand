<aside class="sidebar">
  <div class="logo">
    <span class="logo-icon">
      <app-icon name="logo" [size]="28" />
    </span>
    <span class="logo-text">FindMeBand</span>
  </div>

  <nav class="nav" aria-label="Glavna navigacija">
    @for (item of navItems(); track item.path) {
      <a
        class="nav-item"
        [routerLink]="item.path"
        routerLinkActive="nav-item--active"
        #link="routerLinkActive"
        [attr.aria-current]="link.isActive ? 'page' : null"
      >
        <span class="nav-icon">
          <app-icon [name]="item.icon" [size]="22" />
        </span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-bell">
    <app-notification-bell />
  </div>

  <div class="sidebar-footer">
    <app-avatar
      [name]="currentUser().name"
      [colorId]="currentUser().profileId"
      size="sm"
    />
    <div class="user-info">
      <span class="user-name">{{ currentUser().name }}</span>
      <span class="user-username">&#64;{{ currentUser().username }}</span>
    </div>
    <app-button
      variant="ghost"
      size="sm"
      shape="circle"
      icon="log-out"
      label="Odjava"
      (click)="logout()"
    />
  </div>
</aside>
